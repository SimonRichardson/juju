name: "Spread"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: spread-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Install build deps
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential

      - name: Build juju + jujud
        # Built once and shared with the spread jobs via an artifact so each
        # spread job does not rebuild in the VM (~10-15 min per job).
        run: |
          mkdir -p .spread-bin
          GOBIN="$PWD/.spread-bin" make juju
          GOBIN="$PWD/.spread-bin" make jujud-controller
          file .spread-bin/juju .spread-bin/jujud

      - name: Build patched spread
        # Upstream spread's SendTar emits 'tar --no-same-owner xz' which GNU tar
        # misparses (bare 'xz' treated as a file operand), breaking project
        # delivery. Build from the fixed source. See tests/spread/README.md.
        run: |
          git clone https://github.com/canonical/spread /tmp/spread-src
          git -C /tmp/spread-src checkout 32cad07bfd7fffb395f6c6134b68b1c24f9490c0
          sed -i 's|/bin/tar --no-same-owner xz 2>&1|/bin/tar -xz --no-same-owner 2>&1|' /tmp/spread-src/spread/client.go
          GOBIN="$PWD/.spread-bin" go install ./cmd/spread
          file .spread-bin/spread

      - name: Upload binaries
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: spread-bin
          if-no-files-found: error
          path: |
            .spread-bin/juju
            .spread-bin/jujud
            .spread-bin/spread

  spread:
    name: "spread (${{ matrix.system }}): ${{ matrix.suite }}"
    needs: build-binaries
    runs-on:
      - self-hosted
      - linux
      - x64
      - aws
      # Adjust size/labels to match the org's LXD-capable self-hosted runners
      # (see .github/workflows/smoke.yml).
      - xxlarge
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        system: [ubuntu-22.04]
        suite: [tests/spread/deploy]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          name: spread-bin
          path: .spread-bin

      - name: Enable spread on PATH
        run: |
          chmod +x .spread-bin/spread
          echo "$PWD/.spread-bin" >> "$GITHUB_PATH"

      - name: Setup LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1

      - name: Wait for LXD
        run: |
          while ! ip link show lxdbr0; do
            echo "Waiting for lxdbr0..."
            sleep 10
          done

      - name: Run spread
        run: |
          spread -v lxd:${{ matrix.system }}:${{ matrix.suite }}
